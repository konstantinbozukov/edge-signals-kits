name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg:
          - langchain/js
          - quickstarts/node
          - elizaos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: ${{ matrix.pkg }}
        run: npm install
      - name: Build
        working-directory: ${{ matrix.pkg }}
        run: npm run build --if-present
      - name: Test
        working-directory: ${{ matrix.pkg }}
        run: npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: LangChain package
        run: |
          pip install -e "./langchain/python[dev]"
          pytest langchain/python/tests -q
      - name: Quickstart Python
        run: pytest quickstarts/python/test_token_verdict.py -q
      - name: CrewAI example
        run: |
          pip install -e ./langchain/python
          pip install crewai pytest pytest-asyncio
          pytest crewai/tests -q
      - name: OpenAI Agents example
        run: |
          pip install -e ./langchain/python
          pip install openai-agents pytest pytest-asyncio
          pytest openai-agents/tests -q