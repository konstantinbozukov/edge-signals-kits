[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edge-signals-langchain"
version = "0.1.0"
description = "LangChain tools for Edge Signals Token Verdict (x402)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "langchain-core>=0.3.0",
  "pydantic>=2.0",
]

[project.urls]
Homepage = "https://signals.edge.report"
Repository = "https://github.com/konstantinbozukov/edge-signals-kits"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/edge_signals_langchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]